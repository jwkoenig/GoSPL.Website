name: Deploy to beta.gospl.io

# Runs deploy.ps1 on the office workstation's self-hosted runner. The script
# pulls PLAY + Website, builds, stages and uploads changed files over SFTP;
# its state lives next to it in C:\GOSPL\SERVER_DEPLOY, so there is no
# checkout here. Started by hand (Actions tab, or Claude via the GitHub
# tools); see docs/DEPLOYMENT.md. Never add pull_request triggers: a
# self-hosted runner must not run code from forks.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the files that would be uploaded
        type: boolean
        default: false
      full:
        description: Re-upload everything, ignoring the manifest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workstation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, gospl-gpu]
    steps:
      - name: deploy.ps1 beta -Pull
        shell: powershell
        env:
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}
          DRY_RUN: ${{ inputs.dry_run }}
          FULL: ${{ inputs.full }}
        run: |
          $script = if ($env:DEPLOY_SCRIPT) { $env:DEPLOY_SCRIPT } else { 'C:\GOSPL\SERVER_DEPLOY\deploy.ps1' }
          $opts = @{ Pull = $true }
          if ($env:DRY_RUN -eq 'true') { $opts.DryRun = $true }
          if ($env:FULL -eq 'true') { $opts.Full = $true }
          & $script beta @opts
